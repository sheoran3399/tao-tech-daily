<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tao Tech Daily — Studio</title>
<style>body{font:16px system-ui;background:#0d1722;color:#f2ead9;max-width:950px;margin:auto;padding:30px}button,input,textarea,select{font:inherit;padding:9px;border-radius:7px}button{background:#b8a16e;border:0;cursor:pointer;margin:4px}input,textarea{background:#223241;color:white;border:1px solid #536476}textarea{width:96%;min-height:90px}article{background:#182938;padding:18px;margin:16px 0;border-radius:12px}small,a{color:#b6c5d0}video{width:230px;max-width:100%}.error{color:#ffc5aa}</style>
<h1>☯ Tao Tech Daily</h1><p>Tech headlines, timeless Taoist wisdom, 30-second Chinese-anime videos.</p>
<p><a href="/watch">Public gallery</a></p><label>Admin token <input type="password" id="token" placeholder="STUDIO_ADMIN_TOKEN"></label><button onclick="ingest()">Discover headlines</button><button onclick="load()">Refresh</button><p id="msg"></p><div id="stories"></div>
<script>
const el=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Admin-Token':el('token').value},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data));return data}
async function action(fn){try{el('msg').textContent=JSON.stringify(await fn());await load()}catch(e){el('msg').textContent=e.message}}
function ingest(){action(()=>api('/api/ingest','POST'))}
function render(id,mode){action(()=>api('/api/stories/'+id+'/render?mode='+mode,'POST'))}
function publish(id){action(()=>api('/api/stories/'+id+'/publish','POST'))}
function save(id){action(()=>api('/api/stories/'+id,'PATCH',{script:el('script'+id).value,insight:el('insight'+id).value,translation:el('translation'+id).value,quote:el('quote'+id).value,chapter:el('chapter'+id).value}))}
function review(id){action(()=>api('/api/stories/'+id+'/review','POST',{verified:el('verified'+id).checked,quote_checked:el('quotechecked'+id).checked,approved:el('approved'+id).checked}))}
async function load(){try{let rows=await api('/api/stories');el('stories').innerHTML=rows.map(s=>`<article><h2>${esc(s.headline)}</h2><small>${esc(s.source)} · ${esc(s.status)} · <a target="_blank" rel="noopener" href="${esc(s.url)}">Read source</a></small><p>Chinese quote</p><input id="quote${s.id}" value="${esc(s.quote)}"><p>Chapter</p><input id="chapter${s.id}" value="${esc(s.chapter)}"><p>English translation</p><textarea id="translation${s.id}">${esc(s.translation)}</textarea><p>Insight</p><textarea id="insight${s.id}">${esc(s.insight)}</textarea><p>30-second narration script</p><textarea id="script${s.id}">${esc(s.script)}</textarea><p><button onclick="save(${s.id})">Save edits</button><button onclick="render(${s.id},'preview')">Preview</button><button onclick="render(${s.id},'production')">Generate AI video</button></p>${s.video?`<video controls src="/videos/${esc(s.video)}"></video>`:''}<p><label><input type="checkbox" id="verified${s.id}" ${s.verified?'checked':''}> Source verified</label><label><input type="checkbox" id="quotechecked${s.id}" ${s.quote_checked?'checked':''}> Quote checked</label><label><input type="checkbox" id="approved${s.id}" ${s.approved?'checked':''}> Approve</label></p><button onclick="review(${s.id})">Save review</button><button onclick="publish(${s.id})">Publish</button></article>`).join('')||'<p>No stories yet. Discover headlines to begin.</p>'}catch(e){el('msg').textContent=e.message}}
load();
</script></html>
