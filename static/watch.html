<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tao Tech Daily</title><style>body{font:16px system-ui;background:#0d1722;color:#f4e9d5;max-width:900px;margin:30px auto;padding:20px}article{background:#1b2c3a;padding:20px;margin:20px 0;border-radius:14px}video{width:270px;max-width:100%}a{color:#b5c6d8}</style><h1>☯ Tao Tech Daily</h1><p>Ancient wisdom for the age of AI.</p><a href="/">Editorial studio</a><main id="gallery"></main><script>fetch('/api/stories').then(r=>r.json()).then(rows=>{let published=rows.filter(x=>x.status==='published');document.getElementById('gallery').innerHTML=published.map(x=>{let e=document.createElement('article');e.textContent=x.headline+' — '+x.translation;let v=document.createElement('video');v.controls=true;v.src='/videos/'+encodeURIComponent(x.video);e.appendChild(v);return e.outerHTML}).join('')||'No published videos yet.'})</script></html>
